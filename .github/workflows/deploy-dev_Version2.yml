name: Deploy to DEV Environment

on:
  push:
    branches:
      - develop
    paths:
      - 'terraform/dev/**'
      - '.github/workflows/deploy-dev.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'terraform/dev/**'

env:
  ENVIRONMENT: dev
  TF_VERSION: 1.5.0

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan-dev:
    name: Terraform Plan (DEV)
    runs-on: ubuntu-latest
    outputs:
      plan_exists: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.DEV_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=demoapp-dev/terraform.tfstate" \
            -backend-config="region=${{ secrets.DEV_AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -upgrade
        working-directory: ./terraform/dev

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform/dev

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -lock=false
        working-directory: ./terraform/dev
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = `${{ steps.plan.outputs.stdout }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔧 Terraform Plan (DEV)\n\`\`\`\n${plan}\n\`\`\``
            });

  terraform-apply-dev:
    name: Terraform Apply (DEV)
    needs: terraform-plan-dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.DEV_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=demoapp-dev/terraform.tfstate" \
            -backend-config="region=${{ secrets.DEV_AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -upgrade
        working-directory: ./terraform/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform/dev

      - name: Output Infrastructure Info
        run: terraform output -json
        working-directory: ./terraform/dev