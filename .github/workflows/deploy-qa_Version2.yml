name: Deploy to QA Environment

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/qa/**'
      - '.github/workflows/deploy-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/qa/**'

env:
  ENVIRONMENT: qa
  TF_VERSION: 1.5.0

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan-qa:
    name: Terraform Plan (QA)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.QA_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.QA_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.QA_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=demoapp-qa/terraform.tfstate" \
            -backend-config="region=${{ secrets.QA_AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -upgrade
        working-directory: ./terraform/qa

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform/qa

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform/qa

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -lock=false
        working-directory: ./terraform/qa
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = `${{ steps.plan.outputs.stdout }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔧 Terraform Plan (QA)\n\`\`\`\n${plan}\n\`\`\``
            });

  terraform-apply-qa:
    name: Terraform Apply (QA)
    needs: terraform-plan-qa
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: qa
      url: https://qa-demoapp.example.com
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.QA_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.QA_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.QA_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=demoapp-qa/terraform.tfstate" \
            -backend-config="region=${{ secrets.QA_AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -upgrade
        working-directory: ./terraform/qa

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform/qa

      - name: Output Infrastructure Info
        run: terraform output -json > qa-output.json
        working-directory: ./terraform/qa

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: qa-terraform-output
          path: terraform/qa/qa-output.json